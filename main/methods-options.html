<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Methods section options | The Confidence Rebirth</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600;700&family=Reenie+Beanie&display=swap">
<style>
:root{--paper:#F7F3EA;--paper-2:#EFE8DA;--card:#FFFDF8;--butter:#F3E2A0;--butter-2:#FAF0C8;--ink:#2B2623;--ink-2:#4A433E;--muted:#776D66;--pen:#B4382F;--tape:rgba(226,212,176,.9);--rule:rgba(96,120,150,.16);
  --serif:"Instrument Serif",Georgia,serif;--sans:"Montserrat",system-ui,sans-serif;--hand:"Reenie Beanie",cursive}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.page{max-width:1180px;margin:0 auto;padding:clamp(28px,5vw,56px) 16px 80px}
.page>header{max-width:60ch;margin-bottom:30px}
.page>header h1{font:400 clamp(40px,6vw,64px)/1 var(--serif);margin:0 0 10px}
.page>header p{margin:0;color:var(--ink-2)}
.opt{margin:0 0 clamp(44px,6vw,72px)}
.opt>.cap{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.cap .n{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--butter);font-weight:700;flex:none}
.cap b{font-weight:600}.cap small{display:block;color:var(--muted);font-size:13px}
.stage{position:relative;background:var(--paper-2);border-radius:6px;padding:clamp(26px,4vw,48px) clamp(14px,3vw,40px);overflow:hidden}
.stage.lined{background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px)}
.note{font-family:var(--hand);color:var(--pen);font-size:30px;line-height:1;rotate:-2deg;display:inline-block}
.h{font:400 clamp(40px,6vw,72px)/.95 var(--serif);margin:4px 0 22px}
.lab{font-weight:700;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.ico{width:46px;height:46px;fill:none;stroke:var(--pen);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:999px;background:var(--butter);border:1px solid var(--ink);font-weight:600;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--ink);cursor:pointer;justify-self:start;align-self:start}
.mname{font:400 clamp(32px,3.6vw,46px)/.95 var(--serif)}
.mname small{display:block;font:700 10px/1.6 var(--sans);letter-spacing:.24em;text-transform:uppercase}
p{margin:0}
.who{color:var(--ink-2)}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px}

/* 1. folder dividers */
.d1{display:flex;gap:0;height:470px;align-items:stretch}
.d1 .f{position:relative;flex:0 0 58px;background:var(--butter-2);border:1px solid rgba(43,38,35,.14);border-radius:14px 14px 4px 4px;margin-left:-8px;cursor:pointer;transition:flex .45s cubic-bezier(.4,.1,.2,1),background .3s;overflow:hidden;box-shadow:-6px 0 14px -10px rgba(70,50,30,.4)}
.d1 .f:nth-child(even){background:#F6E8B5}
.d1 .f:first-child{margin-left:0}
.d1 .f.on{flex:1 1 auto;background:var(--card);cursor:default}
.d1 .tab{position:absolute;left:0;top:0;bottom:0;width:58px;display:flex;align-items:center;justify-content:center}
.d1 .tab span{writing-mode:vertical-rl;rotate:180deg;font:400 26px/1 var(--serif);white-space:nowrap}
.d1 .f.on .tab span{color:var(--pen)}
.d1 .body{position:absolute;left:66px;right:22px;top:26px;bottom:22px;display:grid;align-content:start;gap:12px;opacity:0;transition:opacity .3s;min-width:230px}
.d1 .f.on .body{opacity:1;transition-delay:.25s}
@media (max-width:700px){.d1{flex-direction:column;height:auto}.d1 .f{flex:0 0 auto;min-height:54px;margin:-8px 0 0;border-radius:14px 14px 4px 4px}.d1 .f:first-child{margin-top:0}
 .d1 .tab{position:static;width:auto;height:54px;justify-content:flex-start;padding:0 18px}.d1 .tab span{writing-mode:horizontal-tb;rotate:0deg}.d1 .body{position:static;display:none;padding:0 18px 20px;min-width:0}.d1 .f.on .body{display:grid}}

/* 2. index card stack */
.d2{display:grid;place-items:center;min-height:520px}
.d2 .deck{position:relative;width:min(380px,86vw);height:430px}
.d2 .c{position:absolute;inset:0;overflow:hidden;background:var(--card);border:1px solid rgba(43,38,35,.16);border-radius:4px;padding:26px 24px;display:grid;align-content:start;gap:10px;
  background-image:linear-gradient(transparent 62px,rgba(180,56,47,.45) 62px 63px,transparent 63px),repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px);background-position:0 0,0 63px;
  box-shadow:0 16px 30px -24px rgba(70,50,30,.5);transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .4s}
.d2 .ctl{display:flex;gap:10px;justify-content:center;margin-top:18px;align-items:center}
.d2 .ctl button{width:44px;height:44px;border-radius:50%;border:1px solid var(--ink);background:var(--card);cursor:pointer;font-size:18px}
.d2 .ctl span{font-family:var(--hand);color:var(--pen);font-size:26px;min-width:70px;text-align:center}

/* 3. contents page */
.d3{max-width:760px;margin:0 auto;background:var(--card);border:1px solid rgba(43,38,35,.14);padding:clamp(24px,4vw,44px);box-shadow:0 20px 40px -32px rgba(70,50,30,.5)}
.d3 h3{font:italic 400 clamp(34px,4vw,48px)/1 var(--serif);margin:0 0 18px}
.d3 .row{border-top:1px solid rgba(43,38,35,.15)}
.d3 .row:last-child{border-bottom:1px solid rgba(43,38,35,.15)}
.d3 .row>button{width:100%;display:flex;align-items:baseline;gap:12px;padding:16px 0;background:none;border:0;cursor:pointer;text-align:left}
.d3 .num{font:italic 400 30px/1 var(--serif);color:var(--pen);width:26px}
.d3 .t{font:400 clamp(26px,3vw,34px)/1 var(--serif)}
.d3 .dots{flex:1;border-bottom:2px dotted rgba(43,38,35,.3);translate:0 -6px}
.d3 .pg{font-family:var(--hand);color:var(--pen);font-size:26px}
.d3 .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
.d3 .row.on .more{grid-template-rows:1fr}
.d3 .more>div{overflow:hidden;padding-left:38px}
.d3 .more>div>*{margin-bottom:10px}
.d3 .more>div>a{margin-bottom:18px}

/* 4. polaroid collage */
.d4{display:flex;flex-wrap:wrap;justify-content:center;gap:28px 22px;padding-top:10px}
.d4 .p{position:relative;width:min(200px,42vw);background:var(--card);padding:12px 12px 16px;box-shadow:0 14px 26px -18px rgba(70,50,30,.55);rotate:var(--r);transition:rotate .3s,translate .3s;cursor:pointer;text-align:center}
.d4 .p:hover{rotate:0deg;translate:0 -6px}
.d4 .p::before{content:"";position:absolute;top:-11px;left:calc(50% - 34px);width:68px;height:22px;background:var(--tape);rotate:calc(var(--r) * -1.5)}
.d4 .pic{aspect-ratio:1;display:grid;place-items:center;background:var(--butter-2)}
.d4 .pic .ico{width:62px;height:62px}
.d4 .p b{display:block;font:400 26px/1 var(--serif);margin-top:12px}
.d4 .p i{display:block;font-family:var(--hand);font-style:normal;color:var(--pen);font-size:22px;line-height:1.05;margin-top:4px}
.d4 .p.on{outline:2px solid var(--pen);outline-offset:4px}
.d4 .detail{flex-basis:100%;max-width:640px;margin:8px auto 0;background:var(--card);border:1px solid rgba(43,38,35,.15);padding:22px;display:grid;gap:10px}

/* 5. which sounds like you */
.d5{display:grid;gap:12px;max-width:760px;margin:0 auto}
.d5 label{display:flex;align-items:flex-start;gap:14px;background:var(--card);border:1px solid rgba(43,38,35,.16);border-radius:6px;padding:18px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.d5 input{appearance:none;flex:none;width:26px;height:26px;border:1.6px solid var(--pen);border-radius:4px;margin:2px 0 0;display:grid;place-items:center;background:var(--card);cursor:pointer}
.d5 input:checked{background:var(--butter)}
.d5 input:checked::after{content:"";width:12px;height:7px;border-left:2px solid var(--pen);border-bottom:2px solid var(--pen);rotate:-45deg;translate:0 -2px}
.d5 label:has(input:checked){border-color:var(--pen);box-shadow:-4px 4px 0 var(--butter)}
.d5 .q{font:400 clamp(22px,2.4vw,28px)/1.15 var(--serif)}
.d5 .res{display:none;margin-top:8px;gap:8px}
.d5 label:has(input:checked) .res{display:grid}
.d5 .res b{font-family:var(--hand);color:var(--pen);font-size:28px;font-weight:400;line-height:1}

/* 6. sticky notes that flip */
.d6{display:flex;flex-wrap:wrap;justify-content:center;gap:22px}
.d6 .s{width:min(210px,42vw);aspect-ratio:1;perspective:900px;cursor:pointer;rotate:var(--r)}
.d6 .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.8,.3,1)}
.d6 .s.on .in{transform:rotateY(180deg)}
.d6 .fa{position:absolute;inset:0;backface-visibility:hidden;padding:18px;display:grid;align-content:center;justify-items:center;gap:8px;text-align:center;background:var(--bg);box-shadow:0 12px 20px -14px rgba(70,50,30,.55)}
.d6 .fa::before{content:"";position:absolute;inset:0 0 auto;height:22%;background:linear-gradient(rgba(80,60,40,.06),transparent)}
.d6 .bk{transform:rotateY(180deg);align-content:start;justify-items:start;text-align:left;font-size:13.5px;line-height:1.45}
.d6 .fa b{font:400 28px/1 var(--serif)}
.d6 .fa i{font-family:var(--hand);font-style:normal;color:var(--pen);font-size:22px}
.d6 .bk a{margin-top:auto;font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--pen)}

/* 7. chapters swipe row */
.d7{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 18px;scrollbar-width:none}
.d7::-webkit-scrollbar{display:none}
.d7 .ch{flex:0 0 min(320px,80vw);scroll-snap-align:start;background:var(--card);border:1px solid rgba(43,38,35,.14);padding:26px 24px;display:grid;gap:12px;align-content:start;min-height:390px;position:relative}
.d7 .big{font:italic 400 120px/.8 var(--serif);color:var(--butter);position:absolute;right:14px;top:14px;-webkit-text-stroke:1px rgba(180,56,47,.4)}
.d7 .lab{position:relative}
.d7 .bar{height:2px;background:rgba(43,38,35,.12);margin-top:6px;position:relative}
.d7 .bar i{position:absolute;inset:0 auto 0 0;background:var(--pen);width:20%;transition:width .2s}

/* 8. tabs and one big page */
.d8 .pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.d8 .pills button{position:relative;padding:10px 18px;border-radius:999px;border:1px solid rgba(43,38,35,.3);background:var(--card);cursor:pointer;font-weight:500}
.d8 .pills button.on{background:var(--butter);border-color:var(--ink)}
.d8 .pills button.on::after{content:"";position:absolute;inset:-7px -10px;border:1.6px solid var(--pen);border-radius:50% 46% 52% 44%/60% 50% 56% 48%;rotate:-3deg;pointer-events:none}
.d8 .panel{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start;max-width:820px;margin:0 auto;background:var(--card);border:1px solid rgba(43,38,35,.14);padding:clamp(22px,4vw,40px);box-shadow:0 20px 40px -32px rgba(70,50,30,.5);animation:fadein .35s}
.d8 .panel .ico{width:76px;height:76px;background:var(--butter-2);border-radius:50%;padding:12px}
.d8 .panel>div{display:grid;gap:12px}
@keyframes fadein{from{opacity:0;translate:0 8px}}
@media (max-width:600px){.d8 .panel{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="page">
<header>
  <h1>Five methods, 8 ways to show them</h1>
  <p>Same content, same journal look, different layouts. They all work on a phone. Tap and play with each one, then pick a number.</p>
</header>
<div id="opts"></div>
</div>
<script>
const M=[
 {k:"headtoe",t:"Head to Toe",who:"Women who pick their body apart in the mirror and don't feel at home in their own skin.",ch:"Feel good in your body as it is now, without waiting to change first.",feel:"I pick my body apart in the mirror",ic:'<circle cx="24" cy="8.5" r="4.5"/><path d="M17 43l4-13-3.5-8.5c0-3.8 2.8-6.3 6.5-6.3s6.5 2.5 6.5 6.3L27 30l4 13z"/><path d="M36.5 11.5c-1.2-1.6-3.7-1.2-3.7.9 0 1.7 2.3 3 3.7 4 1.4-1 3.7-2.3 3.7-4 0-2.1-2.5-2.5-3.7-.9z"/>'},
 {k:"beyond",t:"Beyond the Mirror",who:"Women who've worked on body confidence but still doubt themselves day to day.",ch:"Carry yourself with confidence everywhere and go after the job, the partner and the lifestyle.",feel:"I feel OK in my body, but I still doubt myself",ic:'<ellipse cx="17" cy="18" rx="9.5" ry="12"/><path d="M17 30v12"/><path d="M27 25l13-11"/><path d="M33 13.5h7v7"/><path d="M38 31l1.4 3 3 1.4-3 1.4-1.4 3-1.4-3-3-1.4 3-1.4z"/>'},
 {k:"gogetter",t:"Go Getter",who:"Women with imposter syndrome who don't speak up for themselves, or haven't found their purpose yet.",ch:"Speak up, back yourself at work and go after what you're here to do.",feel:"I don't speak up, and I feel like a fraud at work",ic:'<path d="M29 6l4 8.5 9.3 1.2-6.8 6.4 1.8 9.2L29 26.8l-8.3 4.5 1.8-9.2-6.8-6.4 9.3-1.2z"/><path d="M6 30h9M9 36h10M14 42h10"/>'},
 {k:"boundary",t:"Boundary Boss",who:"People pleasers who struggle to say no and stand firm.",ch:"Say no, mean it and hold your boundaries, without the guilt.",feel:"I say yes when I mean no",ic:'<path d="M24 5l15 5.5v11c0 10-6.5 16.5-15 21-8.5-4.5-15-11-15-21v-11z"/><path d="M17 23.5l5 5 9-10"/>'},
 {k:"comeback",t:"Comeback",who:"Women rebuilding after a breakup, a loss or a hard season, who feel they've lost their spark.",ch:"Rebuild after a hard season and get your spark back.",feel:"I've been through a lot and lost my spark",ic:'<path d="M24 43c-7.7 0-12.5-4.8-12.5-11.3 0-6.4 5.2-9.4 6.5-16.2 3.6 2.7 4.8 6.1 4.8 9 1.9-1.6 3-4.6 2.9-7.7C31.6 20.2 36.5 25 36.5 31.4 36.5 38.1 31.7 43 24 43z"/><path d="M24 43c-3 0-5-2-5-4.7 0-2.8 2.6-4.2 3.3-7 2.6 1.6 6.7 3.8 6.7 7 0 2.7-2 4.7-5 4.7z"/>'}];
const ico=m=>`<svg class="ico" viewBox="0 0 48 48" aria-hidden="true">${m.ic}</svg>`;
const name=m=>`<h3 class="mname"><small>The</small>${m.t}<small>Method</small></h3>`;
const info=m=>`<p class="lab">Who it's for</p><p class="who">${m.who}</p><p class="lab">What changes</p><p>${m.ch}</p><a class="btn" href="#">See how to start</a>`;
const head=`<span class="note">one coach, five ways in</span><h2 class="h">Find your method</h2>`;
const D=[
 ["Folder dividers","Like the inspo folders. Five butter tabs, tap one to open it.","",`<div class="d1">${M.map((m,i)=>`<div class="f${i?'':' on'}" tabindex="0" role="button" aria-label="${m.t}"><div class="tab"><span>${m.t}</span></div><div class="body">${ico(m)}${name(m)}${info(m)}</div></div>`).join("")}</div>`],
 ["Index card stack","A stack of index cards. Flick through them one at a time.","",`<div class="d2"><div class="deck">${M.map(m=>`<div class="c">${ico(m)}${name(m)}<p class="who">${m.who}</p><p><b>What changes:</b> ${m.ch}</p><a class="btn" href="#" style="justify-self:start">See how to start</a></div>`).join("")}</div><div class="ctl"><button type="button" data-d="-1" aria-label="Previous">&larr;</button><span>1 of 5</span><button type="button" data-d="1" aria-label="Next">&rarr;</button></div></div>`],
 ["Contents page","The first page of her journal. Tap a chapter to open it.","lined",`<div class="d3"><h3>Contents</h3>${M.map((m,i)=>`<div class="row${i?'':' on'}"><button type="button"><span class="num">${i+1}</span><span class="t">The ${m.t} Method</span><span class="dots"></span><span class="pg">p.${4+i*6}</span></button><div class="more"><div>${info(m)}</div></div></div>`).join("")}</div>`],
 ["Polaroids","Five taped polaroids with a pen note each. Tap one to read it.","",`<div class="d4">${M.map((m,i)=>`<div class="p${i?'':' on'}" style="--r:${[-4,3,-2,4,-3][i]}deg" tabindex="0" role="button" data-i="${i}"><div class="pic">${ico(m)}</div><b>${m.t}</b><i>${m.feel.toLowerCase()}</i></div>`).join("")}<div class="detail"></div></div>`],
 ["Which sounds like you?","She ticks the line that sounds like her, and it shows her method. No method names to work out first.","lined",`<div class="d5">${M.map((m,i)=>`<label><input type="checkbox" ${i?'':'checked'}><div><p class="q">"${m.feel}"</p><div class="res"><b>that's the ${m.t} Method</b><p class="who">${m.ch}</p><a class="btn" href="#" style="justify-self:start">See how to start</a></div></div></label>`).join("")}</div>`],
 ["Sticky notes","Five notes on the page. Tap one and it flips over to show the method.","",`<div class="d6">${M.map((m,i)=>`<div class="s" style="--r:${[-3,2,-2,3,-1][i]}deg;--bg:${['#FAF0C8','#F3E2A0','#FFFDF8','#F6E8B5','#FAF0C8'][i]}" tabindex="0" role="button" aria-label="Flip ${m.t}"><div class="in"><div class="fa">${ico(m)}<b>${m.t}</b><i>tap to flip</i></div><div class="fa bk"><b style="font-size:22px">${m.t}</b><span>${m.who}</span><a href="#">See how to start</a></div></div></div>`).join("")}</div>`],
 ["Chapters","Five chapters in a swipe row, with a red progress line as she swipes.","lined",`<div class="d7">${M.map((m,i)=>`<article class="ch"><span class="big">${i+1}</span><span class="lab">Chapter ${i+1}</span>${ico(m)}${name(m)}<p class="who">${m.who}</p><p>${m.ch}</p><a class="btn" href="#" style="justify-self:start;margin-top:6px">See how to start</a></article>`).join("")}</div><div class="bar"><i></i></div>`],
 ["Tabs and one page","Five name tabs, the chosen one circled in red pen, with one big page underneath.","",`<div class="d8"><div class="pills">${M.map((m,i)=>`<button type="button" class="${i?'':'on'}" data-i="${i}">${m.t}</button>`).join("")}</div><div class="panel"></div></div>`]
];
document.getElementById("opts").innerHTML=D.map(([t,d,cls,html],i)=>`<section class="opt"><div class="cap"><span class="n">${i+1}</span><div><b>${t}</b><small>${d}</small></div></div><div class="stage ${cls}">${head}${html}</div></section>`).join("");

// 1 folders
document.querySelectorAll(".d1 .f").forEach((f,_,all)=>{ const open=()=>{ all.forEach(x=>x.classList.toggle("on",x===f)); }; f.addEventListener("click",open); f.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); open(); } }); });
// 2 card stack
(function(){ const cs=[...document.querySelectorAll(".d2 .c")], lab=document.querySelector(".d2 .ctl span"); let at=0;
  const lay=()=>{ cs.forEach((c,i)=>{ const k=(i-at+cs.length)%cs.length; c.style.zIndex=10-k; c.style.transform=k===0?"rotate(-1deg)":`translate(${k*8}px,${k*8}px) rotate(${k%2?2.5:-2.5}deg)`; c.style.opacity=k>3?0:1; c.inert=k!==0; }); lab.textContent=(at+1)+" of "+cs.length; };
  document.querySelectorAll(".d2 .ctl button").forEach(b=>b.addEventListener("click",()=>{ at=(at+ +b.dataset.d+cs.length)%cs.length; lay(); })); lay(); })();
// 3 contents
document.querySelectorAll(".d3 .row>button").forEach(b=>b.addEventListener("click",()=>{ const r=b.parentElement; const was=r.classList.contains("on"); document.querySelectorAll(".d3 .row").forEach(x=>x.classList.remove("on")); if(!was) r.classList.add("on"); }));
// 4 polaroids
(function(){ const ps=[...document.querySelectorAll(".d4 .p")], d=document.querySelector(".d4 .detail");
  const show=i=>{ ps.forEach((p,j)=>p.classList.toggle("on",i===j)); d.innerHTML=name(M[i])+info(M[i]); };
  ps.forEach((p,i)=>{ p.addEventListener("click",()=>show(i)); p.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); show(i); } }); }); show(0); })();
// 6 sticky notes
document.querySelectorAll(".d6 .s").forEach(s=>{ const f=e=>{ if(e.target.closest("a")) return; s.classList.toggle("on"); }; s.addEventListener("click",f); s.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); s.classList.toggle("on"); } }); });
// 7 chapters progress
(function(){ const r=document.querySelector(".d7"), bar=r.parentElement.querySelector(".bar i"); r.addEventListener("scroll",()=>{ const p=r.scrollLeft/(r.scrollWidth-r.clientWidth||1); bar.style.width=(20+p*80)+"%"; },{passive:true}); })();
// 8 tabs
(function(){ const bs=[...document.querySelectorAll(".d8 .pills button")], pn=document.querySelector(".d8 .panel");
  const show=i=>{ bs.forEach((b,j)=>b.classList.toggle("on",i===j)); pn.style.animation="none"; void pn.offsetWidth; pn.style.animation=""; pn.innerHTML=ico(M[i])+`<div>${name(M[i])}${info(M[i])}</div>`; };
  bs.forEach((b,i)=>b.addEventListener("click",()=>show(i))); show(0); })();
</script>
</body>
